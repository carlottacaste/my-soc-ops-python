<div id="game-container">
<div class="flex flex-col items-center justify-center min-h-full p-6 bg-gray-50">
    <div class="text-center max-w-sm border-glow-cyan p-8 flex flex-col">
        <h1 class="text-5xl font-bold glow-cyan mb-2" style="font-family: 'Press Start 2P', cursive; letter-spacing: 2px;">SOC OPS</h1>
        <p class="text-lg glow-purple mb-8" style="font-family: 'Press Start 2P', cursive; letter-spacing: 1px;">ARCADE BINGO</p>

        <div class="border-glow-purple p-6 mb-8" style="background-color: var(--dark-card);">
            <h2 class="font-semibold glow-cyan mb-3 text-center" style="font-family: 'Press Start 2P', cursive; font-size: 0.875rem;">HOW TO PLAY</h2>
            <ul class="text-left text-text-light text-xs space-y-2" style="color: var(--text-light);">
                <li style="padding-bottom: 0.25rem;">▶ Find people who match</li>
                <li style="padding-bottom: 0.25rem;">▶ Tap a square when found</li>
                <li style="padding-bottom: 0.25rem;">▶ Get 5 in a row to WIN!</li>
            </ul>
        </div>

        <button
            hx-post="/start"
            hx-target="#game-container"
            hx-swap="outerHTML"
            class="w-full arcade-btn arcade-btn-pink font-semibold py-4 px-8 text-lg"
            style="font-family: 'Press Start 2P', cursive; font-size: 0.75rem;">
            ▶ START GAME
        </button>
    </div>
</div>
</div>
