<div class="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">

        <div class="text-5xl mb-4" style="text-shadow: 0 0 20px var(--neon-pink), 0 0 40px var(--neon-pink);">★</div>
        <h2 class="text-3xl font-bold glow-pink mb-2" style="font-family: 'Press Start 2P', cursive; letter-spacing: 2px;">BINGO!</h2>

        <button
