<div id="game-container">
<div class="flex flex-col min-h-full bg-gray-50">
    <!-- Header -->
    <header class="flex items-center justify-between p-3 border-b" style="background-color: var(--dark-card); border-color: var(--neon-cyan); box-shadow: 0 0 15px var(--neon-cyan);">
        <button
            hx-post="/reset"
            hx-target="#game-container"
            hx-swap="outerHTML"
            class="text-text-light text-xs px-3 py-1.5 border border-text-light" style="color: var(--text-light); border-color: var(--text-light);">
            ◄ MENU
        </button>
        <h1 class="font-bold glow-cyan" style="font-family: 'Press Start 2P', cursive; font-size: 1rem; letter-spacing: 1px;">SOC OPS</h1>
        <div class="w-16"></div>
    </header>

    <!-- Instructions -->
    <p class="text-center text-text-light text-xs py-2 px-4" style="color: var(--neon-cyan); font-family: 'Courier New', monospace; letter-spacing: 0.5px;">
        TAP SQUARES TO FIND YOUR MATCH
    </p>

    <!-- Bingo indicator -->
    {% if session.has_bingo %}
    <div class="text-center py-2 font-semibold text-sm border-glow-pink" style="background-color: rgba(255, 0, 110, 0.1); color: var(--neon-pink); font-family: 'Press Start 2P', cursive; font-size: 0.65rem;">
        ★ BINGO! LINE COMPLETE! ★
    </div>
    {% endif %}

    <!-- Board -->
    <div class="flex-1 flex items-center justify-center p-3">
        {% include "components/bingo_board.html" %}
    </div>
</div>

{% if session.show_bingo_modal %}
    {% include "components/bingo_modal.html" %}
{% endif %}
</div>
